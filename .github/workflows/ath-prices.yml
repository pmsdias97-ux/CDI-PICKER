name: Preços — ações dos membros (15 em 15 min na sessão)

# Atualiza o preço atual + fecho anterior das ações que os MEMBROS têm (≈165 símbolos). Também disparável à mão.
# Segredos: CRON_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY.

# GATILHO: só por disparo (workflow_dispatch), sem `schedule` (os agendamentos do GitHub atrasam horas). Quem dispara é
# lib/pricesDispatch.js, com a regra "no máximo 1 execução por 14 min, dias úteis, 14:30–21:00 UTC": (1) a rota
# /api/stocks/prices, quando alguém abre a plataforma com o mercado aberto e os preços têm >13 min; (2) os crons da Vercel
# (14:35, 18:00 e 21:20 UTC) via /api/cron/dispatch-prices — o das 21:20 apanha o fecho oficial.
on:
  workflow_dispatch:

# Um trigger novo não empilha com um a meio (cancela o anterior — só interessa o mais recente).
concurrency:
  group: ath-prices
  cancel-in-progress: true

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # backstop: nunca pendurar (preços são rápidos)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ath/requirements.txt
      - run: pip install -r scripts/ath/requirements.txt
      - run: python scripts/ath/fetch_ath.py --mode prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
