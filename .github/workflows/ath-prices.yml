name: ATH — preços (3×/dia)

# Atualiza o preço atual + marketcap (shares lidas do site) do S&P 500, 3 vezes por dia útil
# (depois da abertura US, a meio da sessão e depois do fecho). A distância ao ATH (% abaixo)
# é recalculada no site a partir destes valores. O ATH em si é atualizado pelo workflow diário.
# Também disparável à mão. Segredos: CRON_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY.

# GATILHO: só por disparo (workflow_dispatch). Quem dispara é a rota /api/cron/dispatch-prices (crons da Vercel às
# 14:35, 18:00 e 21:20 UTC), que garante NO MÁXIMO 3 execuções por dia útil — uma por janela — por mais vezes que seja
# chamada. Sem `schedule` aqui de propósito: somado ao disparo daria 6/dia.
on:
  workflow_dispatch:

# Um trigger novo não empilha com um a meio (cancela o anterior — só interessa o mais recente).
concurrency:
  group: ath-prices
  cancel-in-progress: true

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # backstop: nunca pendurar (preços são rápidos)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ath/requirements.txt
      - run: pip install -r scripts/ath/requirements.txt
      - run: python scripts/ath/fetch_ath.py --mode prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
