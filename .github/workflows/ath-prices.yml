name: ATH — preços (hora a hora)

# Atualiza o preço atual + marketcap (shares lidas do site) do S&P 500, de hora a hora,
# em dias úteis, na janela de mercado US (14:00–21:00 UTC). A distância ao ATH (% abaixo)
# é recalculada no site a partir destes valores. O ATH em si é atualizado pelo workflow diário.
# Também disparável à mão. Segredos: CRON_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY.

on:
  schedule:
    # Atualização de TODAS as cotações 1 min após a abertura do mercado US (09:31 ET = 14:31 Portugal),
    # em dias de pregão. GitHub cron é UTC e não sabe do horário de verão → duas linhas, uma por estação;
    # a "errada" da estação cai fora de horas e é inofensiva (o _feed_fresh evita escrever dados velhos).
    # Fins de semana já excluídos pelo "1-5"; feriados: o fetch_prices salta (guard por _is_trading_day).
    - cron: "31 13 * * 1-5"    # 09:31 ET no VERÃO (EDT, UTC-4)
    - cron: "31 14 * * 1-5"    # 09:31 ET no INVERNO (EST, UTC-5)
    - cron: "0 14-21 * * 1-5"  # de hora a hora durante a sessão (mantém as cotações frescas)
  workflow_dispatch:

# Um trigger novo não empilha com um a meio (cancela o anterior — só interessa o mais recente).
concurrency:
  group: ath-prices
  cancel-in-progress: true

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # backstop: nunca pendurar (preços são rápidos)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ath/requirements.txt
      - run: pip install -r scripts/ath/requirements.txt
      - run: python scripts/ath/fetch_ath.py --mode prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
