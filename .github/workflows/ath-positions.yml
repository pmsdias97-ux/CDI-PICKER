name: ATH — posições (leve, 10/10 min)

# Passagem LEVE: atualiza SÓ o preço + fecho anterior dos tickers que os MEMBROS têm
# (~2 pedidos bulk ao Yahoo, nada de fast_info/.info) → mantém ranking + portefólios frescos.
# Corre a cada 10 min durante a sessão US (repo público = minutos Actions ilimitados; runners com IPs
# variados = pouco risco de 429). Segredos: CRON_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"   # a cada 10 min, 13:00–21:59 UTC (cobre a sessão em verão e inverno)
  workflow_dispatch:

concurrency:
  group: ath-positions
  cancel-in-progress: true

jobs:
  positions:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # backstop: só posições, é rápido
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ath/requirements.txt
      - run: pip install -r scripts/ath/requirements.txt
      - run: python scripts/ath/fetch_ath.py --mode positions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
